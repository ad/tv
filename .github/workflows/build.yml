name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android platform
        run: |
          [ -f "$ANDROID_HOME/platforms/android-36/android.jar" ] ||
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      # Releases must always be signed with the same key, or updates will not install over each other.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::KEYSTORE_BASE64 secret is not set (see README → Releases)"
              exit 1
            fi
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.1.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Upload APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-${{ github.run_number }}
          path: tv-home.apk
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v1.1.${{ github.run_number }}"
          mkdir dist
          cp tv-home.apk "dist/tv-home-$version.apk"
          cp scripts/setup.sh dist/setup.sh
          gh release create "$version" dist/* \
            --target "${{ github.sha }}" \
            --title "TV Home $version" \
            --generate-notes
